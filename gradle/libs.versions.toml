# Alle Versionen zentral. Geprüft gegen Maven Central / repo.papermc.io am 2026-10-01.
[versions]
# --- Build ---
shadow            = "9.6.1"
protobufPlugin    = "0.10.0"

# --- Protokoll ---
protobuf          = "4.36.2"
grpc              = "1.84.0"
# javax.annotation wird von generiertem gRPC-Code benötigt (@Generated)
annotationApi     = "1.3.2"

# --- Persistenz ---
postgresql        = "42.7.13"
hikari            = "7.1.0"
flyway            = "13.8.1"
lettuce           = "7.8.0.RELEASE"
caffeine          = "3.3.0"

# --- Master ---
javalin           = "7.2.3"
jline             = "4.4.6"
gson              = "2.14.0"
bouncycastle      = "1.86"
snakeyaml         = "2.7"

# --- Wrapper ---
# SFTP-Zugang zu den Verzeichnissen statischer Server.
sshd              = "2.20.0"

# --- Logging ---
slf4j             = "2.0.20"
logback           = "1.5.38"

# --- Minecraft-Plattformen ---
# Minecraft nutzt seit der 26er-Reihe ein neues Versionsschema (26.1 -> 26.2 -> 26.3).
# 26.2 ist die aktuelle STABILE Reihe, 26.3 gibt es bisher nur als Beta.
paperApi          = "26.2.build.129-stable"
velocityApi       = "4.2.0"
minestom          = "2026.09.12-26.2"
adventure         = "5.2.0"

# --- Tests ---
junit             = "6.1.3"
testcontainers    = "1.21.4"
assertj           = "3.27.6"

[libraries]
protobuf-java          = { module = "com.google.protobuf:protobuf-java",      version.ref = "protobuf" }
protobuf-javaUtil      = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
grpc-protobuf          = { module = "io.grpc:grpc-protobuf",                  version.ref = "grpc" }
grpc-stub              = { module = "io.grpc:grpc-stub",                      version.ref = "grpc" }
grpc-nettyShaded       = { module = "io.grpc:grpc-netty-shaded",              version.ref = "grpc" }
grpc-services          = { module = "io.grpc:grpc-services",                  version.ref = "grpc" }
grpc-inprocess         = { module = "io.grpc:grpc-inprocess",                 version.ref = "grpc" }
annotation-api         = { module = "javax.annotation:javax.annotation-api",  version.ref = "annotationApi" }

postgresql             = { module = "org.postgresql:postgresql",              version.ref = "postgresql" }
hikari                 = { module = "com.zaxxer:HikariCP",                    version.ref = "hikari" }
flyway-core            = { module = "org.flywaydb:flyway-core",               version.ref = "flyway" }
flyway-postgresql      = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
lettuce                = { module = "io.lettuce:lettuce-core",                version.ref = "lettuce" }
caffeine               = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

javalin                = { module = "io.javalin:javalin",                     version.ref = "javalin" }
jline                  = { module = "org.jline:jline",                        version.ref = "jline" }
gson                   = { module = "com.google.code.gson:gson",              version.ref = "gson" }
snakeyaml              = { module = "org.yaml:snakeyaml",                      version.ref = "snakeyaml" }
bouncycastle           = { module = "org.bouncycastle:bcprov-jdk18on",        version.ref = "bouncycastle" }
bouncycastle-pkix      = { module = "org.bouncycastle:bcpkix-jdk18on",        version.ref = "bouncycastle" }
sshd-sftp              = { module = "org.apache.sshd:sshd-sftp",              version.ref = "sshd" }

slf4j-api              = { module = "org.slf4j:slf4j-api",                    version.ref = "slf4j" }
logback-classic        = { module = "ch.qos.logback:logback-classic",         version.ref = "logback" }

paper-api              = { module = "io.papermc.paper:paper-api",             version.ref = "paperApi" }
velocity-api           = { module = "com.velocitypowered:velocity-api",       version.ref = "velocityApi" }
minestom               = { module = "net.minestom:minestom",                  version.ref = "minestom" }
adventure-minimessage  = { module = "net.kyori:adventure-text-minimessage",   version.ref = "adventure" }

junit-jupiter          = { module = "org.junit.jupiter:junit-jupiter",        version.ref = "junit" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
assertj                = { module = "org.assertj:assertj-core",               version.ref = "assertj" }
testcontainers-junit   = { module = "org.testcontainers:junit-jupiter",       version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:postgresql",         version.ref = "testcontainers" }

[bundles]
grpc-runtime = ["grpc-protobuf", "grpc-stub", "grpc-nettyShaded", "annotation-api"]
logging      = ["slf4j-api", "logback-classic"]
testing      = ["junit-jupiter", "assertj"]

[plugins]
shadow   = { id = "com.gradleup.shadow",   version.ref = "shadow" }
protobuf = { id = "com.google.protobuf",   version.ref = "protobufPlugin" }
