# Java-Version fuer alle Module. Die Toolchain laedt das JDK bei Bedarf nach,
# ein lokal installiertes JDK dieser Version wird bevorzugt.
vibecloud.javaVersion=25

# Testumgebung fuer "updateTestEnv" - relativ zum Projektverzeichnis.
# Leer lassen, wenn keine Testumgebung gepflegt wird.
vibecloud.testEnv=../vibeCloud-Test

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
